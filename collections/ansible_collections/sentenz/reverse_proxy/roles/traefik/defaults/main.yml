# SPDX-License-Identifier: Apache-2.0
---
traefik_name: traefik
traefik_path: /etc/ansible_collections/reverse_proxy/traefik
# Match the immutable image already used by the repository inventories.
traefik_image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
traefik_networks: []
traefik_docker_network: ""
traefik_docker_endpoint: unix:///var/run/docker.sock
traefik_docker_socket: /var/run/docker.sock
traefik_docker_cli: docker
# For a non-root UID, align host file ownership and use a restricted socket proxy.
traefik_container_user: "0:0"
# Override this list to bind a specific host IP; traefik_ports remains additive.
traefik_published_ports:
  - "80:80"
  - "443:443"
traefik_ports: []
traefik_wait_timeout: 120

# Docker configuration is privileged; custom ownership remains configurable.
traefik_ownership_owner: root
traefik_ownership_group: root
traefik_permission_directory: "0750"
traefik_permission_file: "0600"

traefik_log_level: INFO
traefik_access_log: true
traefik_strict_request_validation: true
traefik_forwarded_headers_trusted_ips: []
traefik_proxy_protocol_trusted_ips: []
traefik_tls_min_version: VersionTLS12

# debug uses Traefik's generated, untrusted certificate unless a pair is supplied.
# intranet requires an explicit certificate pair; ACME modes require an email.
traefik_challenge: debug
traefik_acme_email: ""
traefik_acme_storage: /letsencrypt/acme.json
# Controller-side seed, copied ONLY when the destination does not exist.
traefik_acme_config: acme.json
traefik_certificates_resolver: myresolver
traefik_challenge_dns_provider: cloudflare
traefik_challenge_dns_provider_variables: []
traefik_tls_private_key: ""
traefik_tls_public_cert: ""
traefik_certs_path: "{{ traefik_path }}/certs"
traefik_dynamic_config: dynamic.yml
# Container-side directory; the entire host dynamic directory is mounted here.
traefik_dynamic_config_path: /etc/traefik/dynamic

# Preserve the existing challenge-specific CLI customization interface.
traefik_challenge_http:
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.httpchallenge=true
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.httpchallenge.entrypoint=web
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.email={{ traefik_acme_email }}
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.storage={{ traefik_acme_storage }}
traefik_challenge_dns:
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.dnschallenge=true
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.dnschallenge.provider={{ traefik_challenge_dns_provider }}
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.email={{ traefik_acme_email }}
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.storage={{ traefik_acme_storage }}
traefik_challenge_tls:
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.tlschallenge=true
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.email={{ traefik_acme_email }}
  - --certificatesresolvers.{{ traefik_certificates_resolver }}.acme.storage={{ traefik_acme_storage }}
traefik_challenge_debug: []
traefik_challenge_options: []
