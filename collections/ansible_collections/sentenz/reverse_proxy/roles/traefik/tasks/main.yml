---
- name: Traefik - Validate lifecycle request
  ansible.builtin.assert:
    that:
      - ansible_run_tags | intersect(['destroy', 'restart', 'stop']) | length <= 1
      - traefik_path is string and traefik_path is match('^/.+')
      - traefik_path | normpath != '/'
      - "'..' not in traefik_path.split('/')"
    fail_msg: Use at most one of --tags destroy, restart, or stop, and an absolute project path.
  tags: always

- name: Traefik - Configure and deploy
  when: ansible_run_tags | intersect(['destroy', 'restart', 'stop']) | length == 0
  block:
    - name: Traefik - Validate configuration
      ansible.builtin.import_tasks: validate.yml

    - name: Traefik - Prepare configuration
      ansible.builtin.import_tasks: configure.yml

    - name: Traefik - Deploy containers and wait for health
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_path }}"
        files: [docker-compose.yml]
        docker_cli: "{{ traefik_docker_cli }}"
        state: present
        recreate: "{{ 'always' if traefik_certificates.changed | default(false) else 'auto' }}"
        pull: missing
        wait: true
        wait_timeout: "{{ traefik_wait_timeout }}"
      no_log: true
      when: not ansible_check_mode

    - name: Traefik - Explain check mode scope
      ansible.builtin.debug:
        msg: Check mode predicts file changes; Compose validation and container reconciliation require a normal run.
      when: ansible_check_mode

# 'never' prevents ordinary runs; the explicit conditions also protect against
# inherited role tags and --tags never accidentally selecting lifecycle actions.
- name: Traefik - Destroy containers without deleting certificate data
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_path }}"
    files: [docker-compose.yml]
    docker_cli: "{{ traefik_docker_cli }}"
    state: absent
    remove_volumes: false
  no_log: true
  when: "'destroy' in ansible_run_tags"
  tags: [never, destroy]

- name: Traefik - Recreate containers and wait for health
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_path }}"
    files: [docker-compose.yml]
    docker_cli: "{{ traefik_docker_cli }}"
    state: present
    recreate: always
    pull: missing
    wait: true
    wait_timeout: "{{ traefik_wait_timeout }}"
  no_log: true
  when: "'restart' in ansible_run_tags"
  tags: [never, restart]

- name: Traefik - Stop containers
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_path }}"
    files: [docker-compose.yml]
    docker_cli: "{{ traefik_docker_cli }}"
    state: stopped
  no_log: true
  when: "'stop' in ansible_run_tags"
  tags: [never, stop]
