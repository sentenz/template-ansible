name: Reverse proxy

on:
  pull_request:
    paths:
      - collections/ansible_collections/sentenz/reverse_proxy/**
      - inventory/**/group_vars/all/all.yml
      - .github/workflows/reverse-proxy.yml
  push:
    branches: [main]
    paths:
      - collections/ansible_collections/sentenz/reverse_proxy/**
      - inventory/**/group_vars/all/all.yml
      - .github/workflows/reverse-proxy.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        ansible-core: ["2.17.14", "2.19.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'ansible-core==${{ matrix.ansible-core }}' 'pytest==9.1.1' 'PyYAML==6.0.3'
      - name: Install real collection dependency for syntax checks
        run: ansible-galaxy collection install -r collections/ansible_collections/sentenz/reverse_proxy/requirements.yml
      - name: Syntax check against the real Docker module
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections:/home/runner/.ansible/collections
        run: ansible-playbook -i localhost, collections/ansible_collections/sentenz/reverse_proxy/tests/playbook.yml --syntax-check
      - name: Fetch and verify native Traefik for loopback smoke tests
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o traefik.tar.gz \
            https://github.com/traefik/traefik/releases/download/v3.7.14/traefik_v3.7.14_linux_amd64.tar.gz
          printf '%s  %s\n' d08641f5de2dd3788097bddab1ce4b29c10a0b788566970db707fa5c94c71f15 traefik.tar.gz | sha256sum --check
          tar -xzf traefik.tar.gz traefik
      - name: Run file, lifecycle, Compose, and native Traefik tests
        env:
          TRAEFIK_BINARY: ${{ runner.temp }}/traefik
        run: pytest -q collections/ansible_collections/sentenz/reverse_proxy/tests

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: |
          python -m pip install 'ansible-core==2.19.14' 'ansible-lint==26.9.0'
          ansible-galaxy collection install -r collections/ansible_collections/sentenz/reverse_proxy/requirements.yml
      - name: Lint the collection
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections:/home/runner/.ansible/collections
        run: ansible-lint --offline collections/ansible_collections/sentenz/reverse_proxy
